<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181e2e"><title>Il mio sfogliabile</title>
<style>
:root{--ink:#e9e8e3;--muted:#aab0c0;--accent:#eacb91;--panel:#222a3a;--line:#454e5c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 55% 37%,#444856 0%,#202638 50%,#141926 100%);color:var(--ink);min-height:100vh;font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}.app{width:min(1320px,100%);min-height:100vh;margin:auto;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 28px 10px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:.25em;color:var(--accent);text-transform:uppercase}.top h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(24px,3vw,37px);margin:3px 0 0}.choices{display:flex;gap:6px;border:1px solid var(--line);padding:5px;background:#141b29bb;border-radius:14px}.choices button{border:0;border-radius:9px;background:transparent;color:#d0d4e0;padding:10px 15px;font-weight:600;cursor:pointer}.choices button.active{color:#1b2230;background:#ebcc96;box-shadow:0 2px 9px #0004}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.subtitle{text-align:center;color:var(--muted);margin:4px 0 0;padding:0 18px;font-size:13px}.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:510px;margin:0 16px;overflow:hidden}.stage:before{content:"";position:absolute;width:min(94%,1000px);height:70px;bottom:6%;border-radius:50%;background:#0008;filter:blur(30px)}#book-mount{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:min(68vh,690px);filter:drop-shadow(6px 12px 17px #0008)}.page{background:#fcfaf6;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}.page.hard{border:1px solid #d1c5ad}.notebook #book-mount:after{content:"";position:absolute;top:3%;bottom:3%;left:50%;width:16px;pointer-events:none;z-index:99;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,transparent 0 9px,#b8c0c7 9px 13px,#5f6977 13px 15px,transparent 15px 27px);opacity:.78;filter:drop-shadow(2px 1px 1px #0007)}.magazine .page{filter:saturate(1.08)}.notebook .page{box-shadow:inset 5px 0 8px #b0afa344}.bar{padding:13px 23px 22px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.bar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:46px;cursor:pointer}.bar button:hover{border-color:var(--accent)}.bar button:disabled{opacity:.35;cursor:default}.count{min-width:135px;text-align:center;font-variant-numeric:tabular-nums;color:#e1e0e0}.status{font-size:12px;color:var(--muted);text-align:center;padding:0 14px 12px;min-height:31px}.error{color:#ffd0c3}.pill{padding:9px 13px;background:#19213080;border:1px solid var(--line);border-radius:11px;color:#b9bfd0;font-size:12px}.loading{position:absolute;z-index:5;inset:15% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:20px;color:#fff;background:#151b29ee;gap:9px}.loading[hidden]{display:none}.loading strong{font-family:Georgia,serif;font-size:24px;font-weight:400}.loading span{color:var(--muted)}.loader{height:5px;width:180px;background:#3e4756;border-radius:10px;overflow:hidden;margin-top:14px}.loader b{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.hint{text-align:center;font-size:12px;color:#8a93a7;padding-bottom:9px}@media(max-width:700px){.top{padding:17px 12px 6px;justify-content:center;text-align:center}.top h1{font-size:25px}.choices{width:100%;justify-content:center}.choices button{flex:1;padding:10px 8px}.stage{min-height:380px;margin:0 4px}#book-mount{height:min(64vh,510px)}.bar{gap:6px;padding:8px}.bar button{padding:9px 11px}.pill{display:none}.notebook #book-mount:after{display:none}}
</style>
</head>
<body class="book"><div class="app">
<header class="top"><div><div class="brand">Biblioteca digitale</div><h1>Il mio sfogliabile</h1></div><nav class="choices" aria-label="Scegli lo sfoglio"><button class="active" data-style="book" aria-pressed="true">📖 Libro</button><button data-style="magazine" aria-pressed="false">▤ Rivista</button><button data-style="notebook" aria-pressed="false">▦ Quaderno</button></nav></header>
<p class="subtitle" id="description">Copertina rigida, piega naturale della carta e ombre profonde.</p>
<main class="stage"><div id="book-mount"><div id="flipbook"></div></div><div class="loading" id="loading" role="status"><strong>Prepariamo le pagine…</strong><span id="progress-label">Apertura del documento</span><div class="loader"><b id="progress"></b></div></div></main>
<div class="bar"><button id="first" aria-label="Prima pagina" title="Prima pagina">⇤</button><button id="prev" aria-label="Pagina precedente" title="Indietro">←</button><span class="count" id="counter">Pagina —</span><button id="next" aria-label="Pagina successiva" title="Avanti">→</button><button id="last" aria-label="Ultima pagina" title="Ultima pagina">⇥</button><button id="fullscreen" title="Schermo intero">⛶</button><span class="pill">Trascina l'angolo di una pagina per sfogliarla</span></div><div class="status" id="status" aria-live="polite"></div><div class="hint">Sul telefono puoi sfogliare con il dito · Frecce della tastiera su PC</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
'use strict';
// Per pubblicare un nuovo volume, sostituisci documento.pdf mantenendo questo nome.
const PDF_FILE='documento.pdf';
const $=id=>document.getElementById(id);
let flip=null, images=[], pageRatio=1.414, style='book', current=0, busy=false;
const descriptions={book:'Copertina rigida, piega naturale della carta e ombre profonde.',magazine:'Pagine leggere, movimento rapido e finitura da rivista.',notebook:'Carta morbida, ombre delicate e rilegatura a spirale stilizzata.'};
const options={book:{flippingTime:1150,maxShadowOpacity:.55,showCover:true},magazine:{flippingTime:650,maxShadowOpacity:.28,showCover:false},notebook:{flippingTime:900,maxShadowOpacity:.34,showCover:false}};
function message(msg,error=false){$('status').textContent=msg;$('status').classList.toggle('error',error)}
function setLoading(on,text='',percent=0){$('loading').hidden=!on;if(text)$('progress-label').textContent=text;$('progress').style.width=percent+'%'}
function updateCount(){if(!flip)return;current=flip.getCurrentPageIndex();$('counter').textContent=`Pagina ${Math.min(current+1,images.length)} di ${images.length}`;$('prev').disabled=$('first').disabled=current===0;$('next').disabled=$('last').disabled=current>=images.length-1}
function setStyle(next){if(busy)return;style=next;document.body.className=next;document.querySelectorAll('[data-style]').forEach(b=>{const active=b.dataset.style===next;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});$('description').textContent=descriptions[next];if(images.length)mountFlip(current)}
function mountFlip(pageIndex=0){if(!window.St?.PageFlip){message('La libreria di sfoglio non è disponibile. Verifica la connessione Internet.',true);return}if(flip){try{flip.destroy()}catch(e){console.warn(e)}flip=null}const mount=$('book-mount');mount.innerHTML='<div id="flipbook"></div>';
const maxH=Math.max(280,Math.min(640,window.innerHeight*.69));const h=Math.min(maxH,600);const w=Math.round(h/pageRatio);
const cfg={width:w,height:h,size:'stretch',minWidth:150,maxWidth:w,minHeight:Math.round(150*pageRatio),maxHeight:h,usePortrait:true,autoSize:true,drawShadow:true,mobileScrollSupport:true,showCover:options[style].showCover,flippingTime:options[style].flippingTime,maxShadowOpacity:options[style].maxShadowOpacity,startPage:Math.max(0,Math.min(pageIndex,images.length-1))};
const nodes=images.map((src,i)=>{const div=document.createElement('div');div.className='page'+(style==='book'&&(i===0||i===images.length-1)?' hard':'');if(style==='book'&&(i===0||i===images.length-1))div.dataset.density='hard';const img=document.createElement('img');img.src=src;img.alt=`Pagina ${i+1}`;img.loading='eager';div.appendChild(img);return div});
flip=new St.PageFlip($('flipbook'),cfg);flip.loadFromHTML(nodes);flip.on('flip',updateCount);flip.on('init',updateCount);flip.on('changeOrientation',updateCount);updateCount();message('Sfoglia trascinando la pagina oppure usando le frecce.');}
async function init(){if(!window.pdfjsLib||!window.St?.PageFlip){setLoading(false);message('Impossibile caricare le librerie online. È necessaria una connessione Internet.',true);return}
busy=true;try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const requestUrl=new URL(PDF_FILE,location.href);requestUrl.searchParams.set('v','2');
const response=await fetch(requestUrl,{cache:'no-store'});
if(!response.ok)throw new Error(`HTTP ${response.status}: il PDF non è disponibile all’indirizzo ${requestUrl.pathname}.`);
const buffer=await response.arrayBuffer();
if(buffer.byteLength<100)throw new Error('Il file ricevuto è vuoto o troppo piccolo per essere un PDF.');
const signature=new TextDecoder('ascii').decode(buffer.slice(0,16));
if(!signature.startsWith('%PDF-')){
 const hint=signature.trim().startsWith('<')?'Il sito ha restituito una pagina HTML invece del PDF. Controlla la cartella pubblicata e il percorso del file.':'Il file ricevuto non comincia con la firma %PDF-.';
 throw new Error(hint+` Percorso richiesto: ${requestUrl.pathname}`);
}
let pdf=await pdfjsLib.getDocument({data:new Uint8Array(buffer)}).promise;const count=pdf.numPages;setLoading(true,`${count} pagine trovate…`,5);
const first=await pdf.getPage(1);const v=first.getViewport({scale:1});pageRatio=v.height/v.width;
for(let i=1;i<=count;i++){const page=i===1?first:await pdf.getPage(i);const vp=page.getViewport({scale:Math.min(2.3,1100/page.getViewport({scale:1}).width)});const canvas=document.createElement('canvas');canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp}).promise;images.push(canvas.toDataURL('image/jpeg',.88));canvas.width=0;canvas.height=0;setLoading(true,`Preparazione pagina ${i} di ${count}`,Math.round(i/count*100));}
setLoading(false);busy=false;mountFlip(0)}catch(err){console.error(err);setLoading(false);busy=false;message('Errore apertura PDF: '+(err?.message||err),true)}}
document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>setStyle(b.dataset.style)));
$('prev').addEventListener('click',()=>flip?.flipPrev('bottom'));$('next').addEventListener('click',()=>flip?.flipNext('bottom'));$('first').addEventListener('click',()=>flip?.flip(0,'bottom'));$('last').addEventListener('click',()=>flip?.flip(images.length-1,'bottom'));$('fullscreen').addEventListener('click',async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')flip?.flipNext('bottom');if(e.key==='ArrowLeft')flip?.flipPrev('bottom')});init();
</script>
</body></html>
